schema_version: online-web-agent-search-config-v1
backend_mode: frozen
environment_dir: data/processed/unified_agent_eval_v1_1/environment
text_search:
  provider: frozen_bm25
  top_k: 5
  provider_top_k: 5
  record_max_chars: 1000
  chunk_words: 320
  chunk_overlap_words: 48
  timeout_seconds: 12
visual_search:
  provider: frozen_image_search
  top_k: 5
  entity_top_k: 3
  matching_page_top_k: 5
  record_max_chars: 512
  read_matching_pages: 0
  region_aware: false
page_reader: {provider: none, timeout_seconds: 15, max_response_bytes: 2000000, max_redirects: 3}
cache: {enabled: false, root: outputs/online_web_cache}
provenance: {enabled: false, root: outputs/online_web_agent_v1/provenance}
boundaries: {frozen_test_access: false, training_allowed: false}
